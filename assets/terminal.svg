<svg viewBox="0 0 860 556" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="15">
  <defs>
    <clipPath id="c1"><rect x="28" y="66" width="0" height="22"><animate attributeName="width" from="0" to="82" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="28" y="131" width="0" height="22"><animate attributeName="width" from="0" to="240" begin="1.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="28" y="327" width="0" height="22"><animate attributeName="width" from="0" to="130" begin="4.9s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="28" y="388" width="0" height="22"><animate attributeName="width" from="0" to="120" begin="6.1s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="28" y="449" width="0" height="22"><animate attributeName="width" from="0" to="148" begin="7.3s" dur="0.5s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="858" height="554" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="26" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="48" cy="24" r="7" fill="#febc2e"/>
  <circle cx="70" cy="24" r="7" fill="#28c840"/>
  <text x="430" y="29" text-anchor="middle" fill="#8b949e" font-size="13">akshay@internet-zero — zsh</text>
  <line x1="1" y1="44" x2="859" y2="44" stroke="#21262d"/>

  <!-- whoami -->
  <g clip-path="url(#c1)">
    <text x="28" y="82"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">whoami</tspan></text>
  </g>
  <text x="28" y="109" fill="#e6edf3" opacity="0">akshay reddy — staff ai engineer · agentic systems · bangalore<animate attributeName="opacity" to="1" begin="1.0s" dur="0.3s" fill="freeze"/></text>

  <!-- agents stats command -->
  <g clip-path="url(#c2)">
    <text x="28" y="147"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">./agents --prod --stats</tspan></text>
  </g>
  <text x="46" y="174" opacity="0"><tspan fill="#8b949e">agents deployed ......... </tspan><tspan fill="#ffa657" font-weight="bold">20+</tspan><animate attributeName="opacity" to="1" begin="2.6s" dur="0.25s" fill="freeze"/></text>
  <text x="46" y="201" opacity="0"><tspan fill="#8b949e">accuracy ................ </tspan><tspan fill="#ffa657" font-weight="bold">80% → 96%+</tspan><animate attributeName="opacity" to="1" begin="2.9s" dur="0.25s" fill="freeze"/></text>
  <text x="46" y="228" opacity="0"><tspan fill="#8b949e">response time ........... </tspan><tspan fill="#ffa657" font-weight="bold">3–5 min → &lt;30 s</tspan><animate attributeName="opacity" to="1" begin="3.2s" dur="0.25s" fill="freeze"/></text>
  <text x="46" y="255" opacity="0"><tspan fill="#8b949e">eval cases .............. </tspan><tspan fill="#ffa657" font-weight="bold">500+</tspan><tspan fill="#8b949e"> pre-deploy</tspan><animate attributeName="opacity" to="1" begin="3.5s" dur="0.25s" fill="freeze"/></text>
  <text x="46" y="282" opacity="0"><tspan fill="#8b949e">knowledge graph ......... </tspan><tspan fill="#ffa657" font-weight="bold">4k → 30k</tspan><tspan fill="#8b949e"> assets @ 99%</tspan><animate attributeName="opacity" to="1" begin="3.8s" dur="0.25s" fill="freeze"/></text>
  <text x="46" y="309" opacity="0"><tspan fill="#8b949e">inference latency ....... </tspan><tspan fill="#ffa657" font-weight="bold">150 ms</tspan><tspan fill="#8b949e"> (tensorrt)</tspan><animate attributeName="opacity" to="1" begin="4.1s" dur="0.25s" fill="freeze"/></text>

  <!-- patents -->
  <g clip-path="url(#c3)">
    <text x="28" y="343"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">ls patents/</tspan></text>
  </g>
  <text x="28" y="370" fill="#79c0ff" opacity="0">agent-construction   data-products   payment-prediction-ml<animate attributeName="opacity" to="1" begin="5.6s" dur="0.3s" fill="freeze"/></text>

  <!-- honors -->
  <g clip-path="url(#c4)">
    <text x="28" y="404"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">ls honors/</tspan></text>
  </g>
  <text x="28" y="431" opacity="0"><tspan fill="#79c0ff">mistral-ai-hackathon.</tspan><tspan fill="#ffa657" font-weight="bold">1st</tspan><tspan fill="#79c0ff">   totalenergies-scholar.</tspan><tspan fill="#ffa657" font-weight="bold">€32k</tspan><tspan fill="#79c0ff">   eu-blue-horizon.</tspan><tspan fill="#ffa657" font-weight="bold">2020</tspan><animate attributeName="opacity" to="1" begin="6.8s" dur="0.3s" fill="freeze"/></text>

  <!-- education -->
  <g clip-path="url(#c5)">
    <text x="28" y="465"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">cat education</tspan></text>
  </g>
  <text x="28" y="492" opacity="0"><tspan fill="#e6edf3">msc</tspan><tspan fill="#8b949e"> — école polytechnique, paris (data science) · </tspan><tspan fill="#e6edf3">b.e.</tspan><tspan fill="#8b949e"> — national institute of engineering</tspan><animate attributeName="opacity" to="1" begin="8.0s" dur="0.3s" fill="freeze"/></text>

  <!-- final prompt + blinking cursor -->
  <text x="28" y="526" fill="#3fb950" opacity="0">$<animate attributeName="opacity" to="1" begin="8.5s" dur="0.2s" fill="freeze"/></text>
  <rect x="46" y="512" width="9" height="18" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" begin="8.5s" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
